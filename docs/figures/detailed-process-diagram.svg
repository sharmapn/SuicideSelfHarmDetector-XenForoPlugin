<tspan x="730.0" dy="32">enabled?</tspan>
</text>
<polygon points="1140.0,525 1280,602.5 1140.0,680 1000,602.5" fill="#fff7dc" stroke="#30343b" stroke-width="3"/>
<text x="1140.0" y="598.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#20242a">
<tspan x="1140.0" dy="0">Forum</tspan>
<tspan x="1140.0" dy="32">excluded?</tspan>
</text>
<rect x="1420" y="500" width="430" height="205" rx="16" fill="#eef7f0" stroke="#30343b" stroke-width="3"/>
<text x="1635.0" y="565.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#20242a">
<tspan x="1635.0" dy="0">Normalize message</tspan>
<tspan x="1635.0" dy="33">and build minimized payload</tspan>
<tspan x="1635.0" dy="33">No username or user ID</tspan>
<tspan x="1635.0" dy="33">is sent to the API</tspan>
</text>
<rect x="1980" y="520" width="330" height="165" rx="16" fill="#eef7f0" stroke="#30343b" stroke-width="3"/>
<text x="2145.0" y="582.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#20242a">
