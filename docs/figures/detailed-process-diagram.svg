<tspan x="295.0" dy="33">New thread (A–C)</tspan>
<tspan x="295.0" dy="33">New reply (D–F)</tspan>
<tspan x="295.0" dy="33">Edit reply (G)</tspan>
<tspan x="295.0" dy="33">Edit first post (H)</tspan>
</text>
<polygon points="730.0,525 870,602.5 730.0,680 590,602.5" fill="#fff7dc" stroke="#30343b" stroke-width="3"/>
<text x="730.0" y="598.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#20242a">
