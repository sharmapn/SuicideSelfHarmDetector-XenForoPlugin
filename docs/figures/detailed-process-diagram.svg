<tspan x="1200.0" dy="0">Final action</tspan>
<tspan x="1200.0" dy="32">allow · moderate · revise</tspan>
</text>
<polyline points="390,1165 390,1215 1200,1215 1200,1290" fill="none" stroke="#30343b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<polyline points="1660,1325 1420,1325" fill="none" stroke="#30343b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="90" y="1260" width="670" height="260" rx="16" fill="#f4f6f8" stroke="#30343b" stroke-width="3"/>
<text x="425.0" y="1324.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#20242a">
<tspan x="425.0" dy="0">Scenario mapping</tspan>
<tspan x="425.0" dy="31">A/D: normal thread or reply</tspan>
<tspan x="425.0" dy="31">B/E: ideation</tspan>
<tspan x="425.0" dy="31">C/F: method/action</tspan>
<tspan x="425.0" dy="31">G: edited reply becomes moderated</tspan>
<tspan x="425.0" dy="31">H: edited first post moderates thread</tspan>
</text>
<rect x="40" y="1530" width="2320" height="48" rx="8" fill="#e8edf2"/>
<text x="70" y="1579" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#20242a">
<tspan x="70" dy="0">4  Audit and XenForo outcome</tspan>
</text>
<rect x="80" y="1635" width="500" height="210" rx="16" fill="#e8f6ed" stroke="#30343b" stroke-width="3"/>
<text x="330.0" y="1703.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#20242a">
<tspan x="330.0" dy="0">ALLOW</tspan>
<tspan x="330.0" dy="33">Publish thread or reply</tspan>
<tspan x="330.0" dy="33">Log mode also publishes</tspan>
<tspan x="330.0" dy="33">classified harmful content</tspan>
</text>
<rect x="710" y="1635" width="500" height="210" rx="16" fill="#fff7dc" stroke="#30343b" stroke-width="3"/>
<text x="960.0" y="1703.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#20242a">
<tspan x="960.0" dy="0">MODERATE</tspan>
<tspan x="960.0" dy="33">Send to approval queue</tspan>
<tspan x="960.0" dy="33">Persist thread or reply</tspan>
<tspan x="960.0" dy="33">moderation state</tspan>
</text>
<rect x="1340" y="1635" width="500" height="210" rx="16" fill="#fdeceb" stroke="#30343b" stroke-width="3"/>
<text x="1590.0" y="1703.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#20242a">
<tspan x="1590.0" dy="0">REVISE</tspan>
<tspan x="1590.0" dy="33">Show author warning</tspan>
<tspan x="1590.0" dy="33">Do not create or update</tspan>
<tspan x="1590.0" dy="33">content</tspan>
</text>
<rect x="1940" y="1605" width="380" height="270" rx="16" fill="#f4f6f8" stroke="#30343b" stroke-width="3"/>
<text x="2130.0" y="1691.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#20242a">
<tspan x="2130.0" dy="0">Privacy-safe audit row</tspan>
<tspan x="2130.0" dy="30">Hash, label, risk, score</tspan>
<tspan x="2130.0" dy="30">action and API status</tspan>
<tspan x="2130.0" dy="30">Default: no message text</tspan>
<tspan x="2130.0" dy="30">no raw response or secret</tspan>
</text>
