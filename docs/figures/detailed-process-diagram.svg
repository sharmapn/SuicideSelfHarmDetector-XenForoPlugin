</text>
<rect x="80" y="500" width="430" height="205" rx="16" fill="#eef7f0" stroke="#30343b" stroke-width="3"/>
<text x="295.0" y="549.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#20242a">
