<text x="1180" y="718.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#20242a">
<tspan x="1180" dy="0">Yes</tspan>
</text>
<rect x="40" y="885" width="2320" height="48" rx="8" fill="#e8edf2"/>
<text x="70" y="934" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#20242a">
<tspan x="70" dy="0">3  Classification, policy, and failure handling</tspan>
</text>
<polygon points="2150.0,965 2290,1050.0 2150.0,1135 2010,1050.0" fill="#fff7dc" stroke="#30343b" stroke-width="3"/>
<text x="2150.0" y="1014.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#20242a">
<tspan x="2150.0" dy="0">Valid</tspan>
<tspan x="2150.0" dy="32">authenticated</tspan>
<tspan x="2150.0" dy="32">HTTP 200</tspan>
<tspan x="2150.0" dy="32">response?</tspan>
</text>
<polyline points="2145,685 2145,965" fill="none" stroke="#30343b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="90" y="955" width="600" height="210" rx="16" fill="#eaf2fb" stroke="#30343b" stroke-width="3"/>
<text x="390.0" y="1006.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#20242a">
<tspan x="390.0" dy="0">Success policy</tspan>
<tspan x="390.0" dy="33">Log: all labels → allow</tspan>
<tspan x="390.0" dy="33">Moderate: Safe → allow; harmful → moderate</tspan>
<tspan x="390.0" dy="33">Revise: Safe → allow; Ideation → moderate;</tspan>
<tspan x="390.0" dy="33">Method/action → revise</tspan>
</text>
<rect x="790" y="945" width="710" height="230" rx="16" fill="#eaf2fb" stroke="#30343b" stroke-width="3"/>
<text x="1145.0" y="1006.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#20242a">
<tspan x="1145.0" dy="0">Successful classification</tspan>
<tspan x="1145.0" dy="33">Sentence splitting → Linear SVM</tspan>
<tspan x="1145.0" dy="33">Safe · Ideation · Method/action</tspan>
<tspan x="1145.0" dy="33">Highest severity wins</tspan>
<tspan x="1145.0" dy="33">Unknown labels are conservative</tspan>
</text>
<rect x="1660" y="1220" width="650" height="210" rx="16" fill="#fff0e5" stroke="#30343b" stroke-width="3"/>
<text x="1985.0" y="1271.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#20242a">
<tspan x="1985.0" dy="0">Failure policy</tspan>
<tspan x="1985.0" dy="33">Unavailable (J/K) · Malformed JSON (L)</tspan>
<tspan x="1985.0" dy="33">HTTP 500 (M) · Authentication mismatch (N)</tspan>
<tspan x="1985.0" dy="33">Fail open → allow</tspan>
<tspan x="1985.0" dy="33">Fail closed → moderate</tspan>
</text>
<polyline points="2010,1050 1500,1050" fill="none" stroke="#30343b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
